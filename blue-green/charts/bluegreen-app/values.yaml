replicaCount: 4

image:
  repository: localhost/bluegreen-app
  tag: dev
  pullPolicy: IfNotPresent

app:
  version: v1
fault:
  errorRate: "0"
  latencyMs: "0"
  afterSeconds: "0"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

blueGreen:
  previewReplicaCount: 2
  # Old ReplicaSet must outlive the post-promotion analysis (~90s), or a
  # rollback has to start pods from scratch.
  scaleDownDelaySeconds: 180

analysis:
  prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local
  interval: 15s
  initialDelay: 30s
  count: 4
  failureLimit: 1
  maxErrorRate: "0.05"
  maxP95LatencySeconds: "0.5"

loadgen:
  enabled: true
  requestsPerSecond: 20
  previewRequestsPerSecond: 10
