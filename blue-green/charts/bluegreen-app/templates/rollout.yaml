apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "bluegreen-app.name" . }}
  labels:
    {{- include "bluegreen-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "bluegreen-app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bluegreen-app.selector" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}
            - name: FAULT_ERROR_RATE
              value: {{ .Values.fault.errorRate | quote }}
            - name: FAULT_LATENCY_MS
              value: {{ .Values.fault.latencyMs | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
  strategy:
    blueGreen:
      activeService: {{ include "bluegreen-app.name" . }}-active
      previewService: {{ include "bluegreen-app.name" . }}-preview
      previewReplicaCount: {{ .Values.blueGreen.previewReplicaCount }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      # Switch traffic by itself, but only once the analysis below has passed.
      autoPromotionEnabled: true
      # Runs against the preview pods before any user traffic moves.
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "bluegreen-app.name" . }}-health
        args:
          - name: pod-hash
            valueFrom:
              podTemplateHashValue: Latest
