{{- /*
  <name>-active   users hit this one; Argo Rollouts points it at the live ReplicaSet
  <name>-preview  Argo Rollouts points it at the new ReplicaSet while it is being checked
*/ -}}
{{- range $suffix := list "-active" "-preview" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluegreen-app.name" $ }}{{ $suffix }}
  labels:
    {{- include "bluegreen-app.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "bluegreen-app.selector" $ | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
