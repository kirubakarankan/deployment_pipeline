{{- if .Values.loadgen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canary-app.name" . }}-loadgen
  labels:
    {{- include "canary-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "canary-app.name" . }}-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "canary-app.name" . }}-loadgen
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              delay=$(awk "BEGIN { print 1 / {{ .Values.loadgen.requestsPerSecond }} }")
              while true; do
                curl -s -o /dev/null --max-time 2 http://{{ include "canary-app.name" . }}/ &
                sleep "$delay"
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
{{- end }}
