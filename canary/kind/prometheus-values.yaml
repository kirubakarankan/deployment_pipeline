# Minimal Prometheus: just the server, scraping annotated pods every 10s.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  global:
    scrape_interval: 10s
    evaluation_interval: 10s
  persistentVolume:
    enabled: false
  retention: 1d
